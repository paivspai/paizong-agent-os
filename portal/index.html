ht:38px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.panel h2{font-size:19px;margin:0 0 13px}.panel p{margin:8px 0;color:var(--muted)}.banner{padding:13px 16px;border:1px solid #426073;background:#152d3c;border-radius:12px;color:#c7d5e5;font-size:13px;margin-bottom:17px}.frame{border:1px solid var(--line);border-radius:14px;width:100%;min-height:calc(100dvh - 160px);background:#091323;display:block}.embedWrap{position:relative}.loading{padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--muted)}.metricGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}.metric{border:1px solid var(--line);background:var(--panel);padding:15px;border-radius:12px}.metric small{display:block;color:var(--muted)}.metric b{display:block;font-size:24px;margin-top:5px}.steps{display:grid;gap:8px}.step{border:1px solid #324966;border-radius:9px;padding:11px}.step b{display:block}.step pre{white-space:pre-wrap;word-break:break-word;color:#bad1e6;font:13px/1.6 system-ui;margin:5px 0}.step small{color:#a5b7cb}.run{display:block;width:100%;border:1px solid #375071;background:#182a41;color:white;text-align:left;padding:13px;border-radius:10px;margin-bottom:8px}.run:hover{background:#26405b}.run .hint{color:#9db0c7;font-size:12px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tabs .btn{white-space:nowrap}.badge{font-size:12px;color:var(--orange)}.footnote{font-size:12px;color:#90a7bd;margin:16px 0}.result{padding:16px;border:1px solid #315872;background:#0f2234;border-radius:11px;margin-top:14px;white-space:pre-wrap;line-height:1.8}.listrow{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}.listrow b{display:block}.listrow small{display:block;color:var(--muted)}

<script>
(()=>{'use strict';

let session=null,profile=null,tab='home',busy=false,cache={},agentCatalog=null,activeRun=null;

 if(id==='home')home();else if(['tiktok','profit','gmv','members'].includes(id))embed(id);else if(id==='agent')agent();else if(id==='company')company();else if(id==='factory')factory();else if(id==='retail')retail();}

 '<div class="metricGrid"><div class="metric"><small>业务模块</small><b>8</b></div><div class="metric"><small>成员工具目录</small><b>36</b></div><div class="metric"><small>多 Agent</small><b>8 岗位</b></div><div class="metric"><small>流程模板</small><b>11</b></div></div>'+
 '<div class="cards">'+C.map(m=>'<article class="card"><div class="eyebrow">'+m[1]+' · PAIZONG</div><h3>'+m[2]+'</h3><p>'+m[3]+(m[0]==='factory'?'；出图需额外模型权限与费用确认':m[0]==='retail'?'；本地计算工具':'')+'</p><div class="card-bottom"><span class="tag">'+({tiktok:'已接原版',profit:'原授权校验',gmv:'V3原型',members:'36项目录',agent:'真实后端',company:'云端任务',factory:'权限校验',retail:'本地测算'}[m[0]])+'</span><button class="btn" data-to="'+m[0]+'">进入工作台</button></div></article>').join('')+'</div>'+banner('知识资料、平台流程、岗位 SOUL 目前位于「TikTok 工作台」内部。原有知识库的直接问答质量仍需单独验收，不能把资料展示当作已接通模型问答。')+' <section class="panel" style="margin-top:18px"><h2>已有独立网站（保留原入口）</h2><p class="hint">下面两套旧 Sites 暂未整体搬迁，先保留原站访问；其登录和权限与本网站分别管理。</p><div class="links"><a href="https://paizong-tiktok-helpdesk.psun3025.chatgpt.site" target="_blank" rel="noopener noreferrer">TikTok 知识库答疑原站</a><a href="https://xingyi-store-calculator-20261018.psun3025.chatgpt.site" target="_blank" rel="noopener noreferrer">兴义实体店经营测算原站</a></div></section>';document.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>navigate(b.dataset.to))}
async function embed(id){try{let html=cache[id];if(!html){let d;if(id==='tiktok')d=await signedCall(URLS.tiktok,'POST',{});else if(id==='profit')d=await signedCall(URLS.profit,'GET');else d=await signedCall(URLS.mods,'POST',{module:id});html=d.html;if(!html)throw Error('未收到工作台内容');cache[id]=html}

}catch(e){$('content').innerHTML=banner('Agent 服务连接失败：'+escapeHtml(e.message))}}
function showAgentMessage(t,bad=false){const el=$('agentMessage');if(!el)return;el.classList.remove('hidden');el.textContent=t;el.style.color=bad?'#ffadad':'#aef2df'}
async function detailRun(id){activeRun=id;let d;try{d=await agentApi({action:'detail',run_id:id})}catch(e){showAgentMessage(e.message,true);return};const el=$('runDetail');el.classList.remove('hidden');let steps=d.steps||[],next=steps.find(s=>s.status!=='done');el.innerHTML='<h2>流程详情 · '+escapeHtml(d.run.title)+'</h2><p class="small">当前状态：'+escapeHtml(d.run.status)+'｜仅依据数据库执行记录判断</p><div class="actions"><button class="btn primary" id="agentNext">执行下一步（可能消耗 API 配额）</button><button class="btn" id="agentGate">人工审批当前关卡</button><button class="btn" id="agentRetry">重试失败步骤</button><button class="btn" id="agentRefresh">刷新详情</button></div><div class="steps" style="margin-top:12px">'+steps.map((s,i)=>'<div class="step"><b>'+(i+1)+'. '+escapeHtml(s.title)+' <span class="badge">'+escapeHtml(s.status)+'</span></b><small>岗位：'+escapeHtml(s.agent_key)+' · 实际路由：'+escapeHtml(s.provider||'未确定')+'</small>'+(s.output_text?'<pre>'+escapeHtml(s.output_text).slice(0,10000)+'</pre>':'')+(s.error_text?'<pre style="color:#ff9c9c">'+escapeHtml(s.error_text)+'</pre>':'')+'</div>').join('')+'</div><div id="stepNotice" class="result hidden"></div>';
$('agentNext').disabled=d.run.status==='completed'||d.run.status==='review'||!next||next.agent_key==='manual';$('agentGate').disabled=!next||next.agent_key!=='manual'||next.status!=='pending';$('agentRetry').disabled=!next||next.status!=='failed';
$('agentNext').onclick=()=>agentCommand('step',id);$('agentGate').onclick=()=>{if(confirm('我已核对该人工关口，确认批准？（不会自动发布、付款或寄样）'))agentCommand('gate',id,{confirmation:'我已核查并批准本关口'})};$('agentRetry').onclick=()=>agentCommand('retry',id);$('agentRefresh').onclick=()=>detailRun(id);el.scrollIntoView({behavior:'smooth',block:'start'})}
async function agentCommand(action,id,extra={}){const el=$('stepNotice');el.classList.remove('hidden');el.textContent='服务处理中，等待实际结果…';try{const r=await agentApi({action,run_id:id,...extra});el.textContent=JSON.stringify(r,null,2);await detailRun(id)}catch(e){el.textContent=e.message}}
async function company(){try{const d=await signedCall('/rest/v1/os_tasks_v1?select=id,title,stream,role_id,executor,status,priority,created_at&order=created_at.desc&limit=50','GET');const tasks=Array.isArray(d)?d:[];$('content').innerHTML=banner('公司中枢保留原有25岗位的任务记录；“已派发”仅代表台账状态，没有执行证据不算完成。')+
 '<div class="two"><section class="panel"><h2>新建公司任务</h2><label class="field">任务名称<input class="input" id="taskTitle" placeholder="例如：核实马来西亚新店开店门槛"></label><label class="field">业务条线<select class="input" id="taskStream"><option value="command">管理与总控</option><option value="profit">选品与利润</option><option value="access">准入与开店</option><option value="academy">内容与培训</option><option value="ecosystem">供应链与合作</option></select></label><label class="field">验收标准<textarea class="input" id="taskAcceptance" rows="4" placeholder="来源、证据、日期、预期交付物"></textarea></label><div class="actions"><button class="btn primary" id="taskSave">保存云端任务</button></div><div id="taskMessage" class="result hidden"></div></section><section class="panel"><h2>现有任务 · '+tasks.length+'</h2>'+(tasks.length?tasks.map(t=>'<div class="listrow"><div><b>'+escapeHtml(t.title)+'</b><small>'+escapeHtml(t.stream)+' · '+escapeHtml(t.role_id)+' · '+escapeHtml(t.executor)+'</small></div><span class="tag">'+escapeHtml(t.status)+'</span></div>').join(''):'<p>还没有已保存任务</p>')+'</section></div>';
 $('taskSave').onclick=async()=>{const title=$('taskTitle').value.trim(),acceptance=$('taskAcceptance').value.trim();if(title.length<2)return;try{await signedCall('/rest/v1/os_tasks_v1','POST',{owner_id:profile.id,title,stream:$('taskStream').value,role_id:'strategy',executor:'unassigned',status:'backlog',priority:'P1',acceptance},{Prefer:'return=representation'});company()}catch(e){$('taskMessage').classList.remove('hidden');$('taskMessage').textContent=e.message}};
}catch(e){$('content').innerHTML=banner('公司任务台账暂不可读取：'+escapeHtml(e.message))}}
async function factory(){try{const a=await signedCall(URLS.factory,'GET');if(!a.authorized)throw Error('内容工厂权限未开放');const items=await signedCall('/rest/v1/pai_content_products?select=id,sku,name,category,created_at&order=created_at.desc&limit=50','GET');const products=Array.isArray(items)?items:[];$('content').innerHTML=banner('内容工厂已有私有商品数据和上传权限。当前界面先完成实物照片入库与商品登记；视频生成尚未打通。付费图像模型不自动调用。')+
 '<div class="two"><section class="panel"><h2>上传新女装商品</h2><label class="field">SKU<input class="input" id="sku" placeholder="DRESS-001"></label><label class="field">商品名称<input class="input" id="pname" placeholder="春秋针织连衣裙"></label><label class="field">服装原图（JPG/PNG/WebP，≤12MB）<input class="input" type="file" id="photo" accept="image/png,image/jpeg,image/webp"></label><div class="actions"><button class="btn primary" id="upload">保存商品与原图</button></div><p class="small">照片仅上传到当前授权账户的私有存储，保留原件；上传不等于已生成视频或换装图。</p><div class="result hidden" id="uploadResult"></div></section><section class="panel"><h2>已登记商品 · '+products.length+'</h2>'+(products.length?products.map(x=>'<div class="listrow"><div><b>'+escapeHtml(x.name)+'</b><small>'+escapeHtml(x.sku)+' · '+escapeHtml(x.category)+'</small></div><span class="tag">已入库</span></div>').join(''):'<p>还没有商品。可先上传一件女装测试商品入库。</p>')+'</section></div>';
 $('upload').onclick=uploadFactory;
}catch(e){$('content').innerHTML=banner('内容工厂暂不可进入：'+escapeHtml(e.message)+'。这是单独授权模块。')}}
async function uploadFactory(){const f=$('photo').files?.[0],sku=$('sku').value.trim(),name=$('pname').value.trim(),status=$('uploadResult');status.classList.remove('hidden');if(!f||!sku||!name||f.size>12*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type)){status.textContent='请填写 SKU、商品名称并选择不大于12MB的有效图片';return}try{status.textContent='正在安全上传原图…';const id=crypto.randomUUID(),ext=f.type.split('/')[1]==='jpeg'?'jpg':f.type.split('/')[1],path=profile.id+'/'+id+'/source/garment.'+ext;const r=await fetch(ROOT+'/storage/v1/object/pai-content-assets/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+await token(),'Content-Type':f.type,'x-upsert':'false'},body:f});if(!r.ok){const x=await r.json().catch(()=>({}));throw Error(x.message||x.error||'上传失败 '+r.status)};try{await signedCall('/rest/v1/pai_content_products','POST',{id,user_id:profile.id,sku,name,category:'女装',notes:'',image_path:path},{Prefer:'return=representation'});}catch(e){await fetch(ROOT+'/storage/v1/object/pai-content-assets/'+path,{method:'DELETE',headers:{apikey:KEY,Authorization:'Bearer '+await token()}}).catch(()=>{});throw e};status.textContent='商品与原图保存成功。';factory()}catch(e){status.textContent='上传失败：'+e.message}}
function retail(){const old=(()=>{try{return JSON.parse(localStorage.getItem('pai_retail_v1')||'null')}catch{return null}})()||{aov:120,cost:55,fee:3,rent:12000,wages:18000,utilities:3000,other:5000,target:10000};const fields=[['aov','客单价（元）'],['cost','商品变动成本率（%）'],['fee','其他变动费用率（%）'],['rent','月租金（元）'],['wages','月人工（含老板工资）'],['utilities','月水电杂费（元）'],['other','月其他固定成本（元）'],['target','目标月净利润（元）']];$('content').innerHTML=banner('实体店经营测算是按公式建立的新模块，当前仅保存本机假设，尚未迁移你旧系统的历史经营数据。')+'<div class="two"><section class="panel"><h2>门店经营参数</h2>'+fields.map(f=>'<label class="field">'+f[1]+'<input class="input" type="number" step="0.01" min="0" id="r_'+f[0]+'" value="'+old[f[0]]+'"></label>').join('')+'<div class="actions"><button id="calcRetail" class="btn primary">计算保本与目标销量</button></div></section><section class="panel"><h2>经营倒推结果</h2><div id="retailResult" class="result">输入真实参数后点击计算。</div><p class="small">月固定成本包含租金、人工、水电、其他固定成本。单笔贡献毛利 = 客单价 × (1－成本率－其他变动费率)。保本单量向上取整。</p></section></div>'; $('calcRetail').onclick=()=>{const v=Object.fromEntries(fields.map(f=>[f[0],Number($('r_'+f[0]).value)]));const margin=1-(v.cost+v.fee)/100,unit=v.aov*margin,fixed=v.rent+v.wages+v.utilities+v.other;if(v.aov<=0||v.cost<0||v.fee<0||margin<=0||Object.values(v).some(x=>!Number.isFinite(x)||x<0)){$('retailResult').textContent='输入无效：客单价须大于0，成本率与变动费率之和须低于100%。';return}try{localStorage.setItem('pai_retail_v1',JSON.stringify(v))}catch{};const breakeven=Math.ceil(fixed/unit),goal=Math.ceil((fixed+v.target)/unit);const money=x=>x.toLocaleString('zh-CN',{maximumFractionDigits:2});$('retailResult').textContent='每单贡献毛利：'+money(unit)+' 元\n月固定成本：'+money(fixed)+' 元\n保本订单：'+money(breakeven)+' 单/月\n保本GMV：'+money(breakeven*v.aov)+' 元/月\n目标利润所需：'+money(goal)+' 单/月\n目标GMV：'+money(goal*v.aov)+' 元/月\n日均保本订单（按30天）：'+money(breakeven/30)+' 单\n\n注意：未计入退货损失、税费及资本回收；只有如实填入这些费用，本模型才具有决策意义。'}; $('calcRetail').click()}
$('password').onclick=()=>authLogin('password');$('verify').onclick=()=>authLogin('otp');$('send').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(!email.includes('@')){msg('请输入授权邮箱',true);return}try{await request('/auth/v1/otp','POST',{email,create_user:false});msg('登录验证码已发送，请检查邮箱。')}catch(e){msg(e.message,true)}};
$('reset').onclick=()=>{forget();msg('本机已退出，输入另一个授权账号。')};$('logout').onclick=async()=>{try{await request('/auth/v1/logout','POST',null,await token())}catch{}forget();profile=null;cache={};$('layout').classList.add('hidden');$('login').classList.remove('hidden');msg('已退出。')} ;
session=read();if(session?.access_token){enter()}else{msg('使用你原工作台的邮箱登录；没有授权的用户无法查看内部资料。')}
