<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>派总·多Agent指挥中心 | 独立入口</title><style>
:root{--bg:#0b1320;--panel:#152236;--line:#2e405a;--mint:#60dfc7;--txt:#f3f7ff;--sub:#a6bad0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,"PingFang SC","Microsoft Yahei",sans-serif;color:var(--txt);line-height:1.6}button,input,select,textarea{font:inherit}button{cursor:pointer;color:var(--txt);background:#263c54;border:1px solid #405672;padding:10px 14px;border-radius:10px;font-weight:700}button:hover{filter:brightness(1.15)}button:disabled{opacity:.5}button.primary{background:var(--mint);color:#09212b;border:0}input,select,textarea{width:100%;border:1px solid #38506d;background:#0c1929;color:white;padding:12px;border-radius:9px}label{display:block;color:#c2d2e8;margin:12px 0 5px;font-size:13px}textarea{min-height:110px}.login{max-width:460px;margin:8vh auto;padding:25px;background:var(--panel);border-radius:20px;border:1px solid var(--line)}.login h1{margin-top:0;font-size:24px}.login button{width:100%;margin-top:9px}.hidden{display:none!important}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#111e30;padding:24px 14px;border-right:1px solid var(--line)}.logo{font-size:18px;font-weight:900;margin:0 10px 28px}.logo small{display:block;font-size:11px;color:var(--sub);font-weight:400}.nav{display:block;background:transparent;border:0;text-align:left;width:100%;font-size:15px;margin:3px 0;padding:12px 13px}.nav.active{background:#244052;color:var(--mint)}.main{padding:30px clamp(15px,3vw,40px);min-width:0;max-width:1500px;width:100%;margin:auto}h1{font-size:30px;margin:5px 0 15px}.sub{color:var(--sub);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:14px}.cols{display:grid;grid-template-columns:minmax(320px,0.8fr) minmax(0,1.2fr);gap:14px}.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chip{border-radius:50px;padding:4px 9px;background:#2a3e55;font-size:12px}.good{color:#79eecb}.warn{color:#ffd28f}.bad{color:#ffa8b9}.item{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;border-radius:0;padding:13px 0;font-size:14px}.step{border:1px solid #2d4360;background:#101c2e;border-radius:12px;padding:12px;margin:10px 0}pre{overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1828;padding:13px;border-radius:9px;font-size:13px;max-height:380px}.rolegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.muted{color:var(--sub)}.notice{background:#183145;border:1px solid #2f5d62;padding:12px 14px;border-radius:10px;font-size:13px;margin:17px 0}#msg{position:fixed;bottom:15px;right:15px;background:#315364;padding:12px 15px;border-radius:9px;display:none;max-width:80vw}nav{display:flex;flex-direction:column}.empty{padding:20px 0;color:var(--sub)}@media(max-width:800px){.shell{display:block}.side{position:sticky;top:0;z-index:2;padding:10px}.logo{margin:0 0 8px;font-size:15px}.logo small{display:none}nav{flex-direction:row;overflow:auto}.nav{white-space:nowrap;width:auto;flex:0 0 auto;padding:9px;font-size:14px}.main{padding:15px 12px}h1{font-size:26px}.cols{grid-template-columns:1fr}.card{padding:14px}}
</style></head><body>
<div class="login hidden" id="login"><h1>派总 · 多 Agent 指挥中心</h1><p class="sub">授权邮箱登录。这里不公开课程资料及任务记录。</p><label>登录邮箱</label><input type="email" id="email" autocomplete="username" placeholder="你在原工作台注册的邮箱"><label>密码</label><input type="password" id="pass" autocomplete="current-password" placeholder="已有密码时使用"><button class="primary" id="password">密码登录</button><button id="send">发送邮箱验证码</button><label>邮件验证码</label><input id="code" inputmode="numeric" placeholder="输入邮件里的验证码"><button id="verify">验证码登录</button><p class="sub">未授权账号即使登录成功也无法读取或调用 Agent。</p></div>
<div id="app" class="shell hidden"><aside class="side"><div class="logo">派总 · AI 一人公司<small>TIKTOK MULTI-AGENT OS</small></div><nav><button class="nav active" data-tab="home">◈ 总览</button><button class="nav" data-tab="runs">☷ 任务接力</button><button class="nav" data-tab="roles">◉ 岗位模型</button><button class="nav" data-tab="qa">✓ 验收记录</button></nav></aside><main class="main"><div class="chips"><span class="chip" id="who"></span><button id="refresh">↻ 刷新</button><button id="logout">退出</button></div><h1 id="heading">经营总览</h1><div id="content"></div></main></div><div id="msg"></div>
<script>
(function(){
"use strict";
var root="https://rsiqtfaudqfdhckjovse.supabase.co",key="sb_publishable_2a9ay2duBlIDb_DXyyORfg_l8wnEYGn",store="paizong-auth-v1";
function read(){try{return JSON.parse(localStorage.getItem(store)||"null")}catch{return null}}
function save(v){try{localStorage.setItem(store,JSON.stringify(v))}catch{}}
function clear(){try{localStorage.removeItem(store)}catch{}}
async function request(path,method,body,token){
try{var r=await fetch(root+"/auth/v1/"+path,{method:method,headers:{"apikey":key,"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:body?JSON.stringify(body):undefined});var data=await r.json().catch(()=>({}));if(!r.ok)return {data:null,error:{message:data.msg||data.error_description||data.message||data.error||"HTTP "+r.status}};return {data:data,error:null}}catch(e){return {data:null,error:{message:"认证服务网络不可达："+e.message}}}
}
var auth={
async getSession(){var x=read();if(!x)return {data:{session:null},error:null};if(x.expires_at&&Date.now()/1000+60>=x.expires_at){if(!x.refresh_token){clear();return {data:{session:null},error:null}}var r=await request("token?grant_type=refresh_token","POST",{refresh_token:x.refresh_token});if(r.error){clear();return {data:{session:null},error:r.error}}x={...r.data,expires_at:Math.floor(Date.now()/1000)+(r.data.expires_in||3600)};save(x)}return {data:{session:x},error:null}},
async signInWithPassword(o){var r=await request("token?grant_type=password","POST",{email:o.email,password:o.password});if(!r.error){save({...r.data,expires_at:Math.floor(Date.now()/1000)+(r.data.expires_in||3600)})}return r},
async signInWithOtp(o){return request("otp","POST",{email:o.email,create_user:false})},
async verifyOtp(o){var r=await request("verify","POST",{email:o.email,token:o.token,type:o.type});if(!r.error&&r.data.access_token)save({...r.data,expires_at:Math.floor(Date.now()/1000)+(r.data.expires_in||3600)});return r},
async signOut(){var x=read();if(x?.access_token)await request("logout","POST",null,x.access_token);clear();return {error:null}}
};
window.supabase={createClient:function(){return {auth:auth}}};
})();
</script><script>
(function(){
var ROOT='https://rsiqtfaudqfdhckjovse.supabase.co',KEY='sb_publishable_2a9ay2duBlIDb_DXyyORfg_l8wnEYGn',API=ROOT+'/functions/v1/paizong-multi-agent';
var cli=window.supabase&&window.supabase.createClient(ROOT,KEY),S={tab:'home',catalog:null,runs:[],detail:null,id:null,working:false};
var g=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(x){g('msg').textContent=x;g('msg').style.display='block';setTimeout(()=>g('msg').style.display='none',4500)}
async function call(action,args){var z=(await cli.auth.getSession()).data.session;if(!z)throw Error('未登录');var r=await fetch(API,{method:'POST',headers:{'apikey':KEY,'authorization':'Bearer '+z.access_token,'content-type':'application/json'},body:JSON.stringify(Object.assign({action:action},args||{}))});var v=await r.json();if(!r.ok)throw Error(v.error||'执行失败');return v}
function status(x){var t={queued:'待执行',running:'执行中',blocked:'阻塞',review:'待验收',completed:'已验收',rejected:'已打回',pending:'待运行',done:'已完成',working:'进行中',failed:'失败'};return '<span class="chip '+(['completed','done'].includes(x)?'good':['blocked','failed','rejected'].includes(x)?'bad':'warn')+'">'+esc(t[x]||x)+'</span>'}
function login(){g('login').classList.remove('hidden');g('app').classList.add('hidden')}
async function init(){if(!cli)return login();var x=(await cli.auth.getSession()).data.session;if(!x)return login();try{S.catalog=await call('catalog');g('who').textContent=S.catalog.user;g('login').classList.add('hidden');g('app').classList.remove('hidden');await reload()}catch(e){login();msg(e.message==='not_whitelisted'?'此账号不在 Agent 授权名单':e.message)}}
async function reload(){S.runs=(await call('list')).runs||[];if(S.id){S.detail=await call('detail',{run_id:S.id})}render()}
function go(tab){S.tab=tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));render()}
function render(){var titles={home:'经营总览',runs:'任务接力',roles:'岗位与模型',qa:'老板验收'};g('heading').textContent=titles[S.tab];var e=g('content');if(S.tab==='home'){var n=S.runs.length,done=S.runs.filter(x=>x.status==='completed').length;var cfg=S.catalog.providers;var online=Object.values(cfg).filter(Boolean).length;e.innerHTML='<div class="notice">总调度→岗位模型→审计→人工批准→老板最终验收。没有 API Key 时会中止，不会假装已调用模型。</div><div class="cols"><div class="card"><h2>'+n+' 个任务</h2><p class="muted">已完成验收 '+done+' 个 · 已接模型 '+online+'/4</p><button class="primary" id="start">＋ 创建经营任务</button></div><div class="card"><h2>原工作台</h2><p class="sub">已有的经营 OS 继续独立保存，不修改其任务数据。</p><p><a style="color:#60dfc7" target="_blank" rel="noreferrer" href="'+ROOT+'/functions/v1/paizong-agent-os">进入原 AI 公司 OS</a></p></div></div><div class="card"><h2>最新任务</h2><div id="latest"></div></div>';g('start').onclick=()=>go('runs');g('latest').innerHTML=S.runs.map(x=>'<button class="item" data-id="'+esc(x.id)+'">'+esc(x.title)+' · '+status(x.status)+'</button>').join('')||'<div class="empty">暂无任务</div>';bindOpen();return}
if(S.tab==='roles'){e.innerHTML='<div class="notice">这些岗位有独立提示词、模型与输出记录。显示已配置仅代表服务端存在密钥，实际模型通路必须通过任务执行验证。</div><div class="rolegrid">'+Object.entries(S.catalog.roles).map(([id,r])=>'<div class="card"><b>'+esc(r[0])+'</b><p class="sub">'+esc(r[3])+'</p><p class="sub">'+esc(r[1]+' / '+r[2])+'</p><span class="chip '+(S.catalog.providers[r[1]]?'good':'bad')+'">'+(S.catalog.providers[r[1]]?'已配置':'未配置 Key')+'</span></div>').join('')+'</div><div class="notice">密钥只在 Supabase Edge Functions → Secrets 设置：OPENAI_API_KEY、GEMINI_API_KEY、DEEPSEEK_API_KEY、ANTHROPIC_API_KEY。不要放到前端。</div>';return}
if(S.tab==='qa'){e.innerHTML='<div class="card"><h2>验收台账</h2><p class="sub">只有全部真实岗位步骤完成后，任务才可进入老板最终验收。</p><div id="latest"></div></div>';g('latest').innerHTML=S.runs.map(x=>'<button class="item" data-id="'+esc(x.id)+'">'+esc(x.title)+' · '+status(x.status)+'</button>').join('')||'<div class="empty">暂无验收记录</div>';bindOpen();return}
e.innerHTML='<div class="notice">共有11条协作流程（R0–R10）。市场研究岗位没有实时联网工具，缺少数据就明确标【待核】。</div><div class="cols"><div class="card"><h2>创建任务</h2><label>选择流程</label><select id="flow"></select><label>任务标题</label><input id="title" placeholder="例如：泰国站女装是否值得测试"><label>实际资料与目标</label><textarea id="brief" placeholder="产品、站点、售价、成本、库存、预算、可核查链接、希望交付的结果（至少10字）"></textarea><p><button class="primary" id="create">创建并分工</button></p><h2>任务列表</h2><div id="latest"></div></div><div class="card"><h2>执行与交付</h2><div id="detail" class="empty">请选择任务</div></div></div>';g('flow').innerHTML=Object.entries(S.catalog.flows).map(([k,v])=>'<option value="'+k+'">'+k+' · '+esc(v[0])+'</option>').join('');g('create').onclick=async()=>{try{var v=await call('create',{workflow:g('flow').value,title:g('title').value.trim(),brief:g('brief').value.trim()});S.id=v.run_id;await reload();msg('任务已创建，模型尚未调用')}catch(e){msg(e.message)}};g('latest').innerHTML=S.runs.map(x=>'<button class="item" data-id="'+esc(x.id)+'">'+esc(x.title)+' · '+status(x.status)+'</button>').join('')||'<div class="empty">暂无任务</div>';bindOpen();if(S.detail)detail()}
function bindOpen(){document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{try{S.id=b.dataset.id;S.detail=await call('detail',{run_id:S.id});go('runs')}catch(e){msg(e.message)}})}
function detail(){var d=S.detail,r=d.run;g('detail').className='';g('detail').innerHTML='<b>'+esc(r.title)+'</b> '+status(r.status)+'<p class="sub">'+esc(r.brief)+'</p><div class="chips"><button class="primary" id="auto">▶ 一键接力</button><button id="single">下一步</button><button id="gate">人工批准</button><button id="retry">重试</button><button id="approve">最终验收</button><button id="reject">打回</button></div><h3>岗位执行记录</h3>'+d.steps.map(x=>'<div class="step"><b>'+esc((x.seq+1)+'. '+x.title)+'</b> '+status(x.status)+'<div class="sub">'+esc(x.provider)+'</div>'+(x.output_text?'<pre>'+esc(x.output_text)+'</pre>':'')+(x.error_text?'<div class="bad">'+esc(x.error_text)+'</div>':'')+'</div>').join('')+'<h3>审计日志</h3>'+(d.events.map(x=>'<p class="sub">'+esc(x.created_at.slice(0,19))+' '+x.action+' '+esc(x.detail)+'</p>').join('')||'<p class="sub">暂无调用记录</p>');g('auto').onclick=()=>run(true);g('single').onclick=()=>run(false);g('gate').onclick=async()=>{if(confirm('已核查本关口并批准继续？这不代表真实发布、付款、寄样已发生'))await action('gate',{confirmation:'我已核查并批准本关口'})};g('retry').onclick=()=>action('retry');g('approve').onclick=()=>review('approved');g('reject').onclick=()=>review('rejected')}
async function action(name,extra){try{await call(name,Object.assign({run_id:S.id},extra||{}));await reload()}catch(e){msg(e.message)}}
async function run(auto){if(S.working)return;S.working=true;try{for(var i=0;i<(auto?12:1);i++){var x=await call('step',{run_id:S.id});S.detail=await call('detail',{run_id:S.id});detail();if(x.state!=='done'){msg(x.message||x.error||x.secret||x.state);break}msg(x.agent+' 已交付 / '+x.provider)}}catch(e){msg(e.message)}finally{S.working=false;await reload()}}
async function review(decision){if(!confirm('确认最终'+(decision==='approved'?'验收通过':'验收打回')+'？'))return;await action('review',{decision:decision,note:prompt('验收依据或拒绝原因')||''})}
g('password').onclick=async()=>{if(!cli)return;var r=await cli.auth.signInWithPassword({email:g('email').value.trim(),password:g('pass').value});r.error?msg(r.error.message):init()};
g('send').onclick=async()=>{if(!cli)return;var r=await cli.auth.signInWithOtp({email:g('email').value.trim(),options:{shouldCreateUser:false}});msg(r.error?r.error.message:'邮件已发送，查看验证码或登录链接')};
g('verify').onclick=async()=>{if(!cli)return;var r=await cli.auth.verifyOtp({email:g('email').value.trim(),token:g('code').value.trim(),type:'email'});r.error?msg(r.error.message):init()};
g('logout').onclick=async()=>{await cli.auth.signOut();login()};g('refresh').onclick=()=>reload().catch(e=>msg(e.message));document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>go(x.dataset.tab));init();
})();
</script></body></html>
